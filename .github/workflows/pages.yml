name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['static/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site (static SPA + mock 数据层)
        run: |
          mkdir -p _site
          cp -R static/. _site/
          # 站点说明（访问根路径即应用，README 供抓取）
          cat > _site/README.md << 'EOF'
          # GeoContent Workbench · 在线演示

          本站点为纯静态部署（GitHub Pages）：后端 API 不可达时前端自动进入离线模式，
          全部页面基于内置 mock 数据演示（真实词包问题集 + 演示品牌档案）。

          源码与完整部署方式见：https://github.com/xuyan14/geo-content-workbench
          EOF
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
