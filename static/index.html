  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#D9D9DE;border-radius:4px}::-webkit-scrollbar-thumb:hover{background:#C9C9CE}

     正文14px / 唯品粉 #E6007E / 轻边框无阴影 / 8px 控件圆角（tokens.json 同源） */
  body{font-family:"PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;color:#212121;background:#F7F8FA;font-variant-numeric:tabular-nums}

  /* 桌面按钮基准：32px 高 / 13px/500 / 8px 圆角（规范第3节）；flex 垂直居中，清零纵向内距防溢出 */

  #modal-root button.px-5,#modal-root button.px-6{height:32px!important;min-height:32px!important;font-size:13px!important;font-weight:500;display:inline-flex!important;align-items:center;justify-content:center;padding-top:0!important;padding-bottom:0!important}
  /* 开关：统一 28×16、thumb 12px、品牌粉（规范第3节） */
  .mon-switch{width:28px!important;height:16px!important;border-radius:12px}
  .mon-switch span{width:12px!important;height:12px!important;top:2px!important;left:2px!important;transition:transform .15s}

  .mon-switch.bg-slate-200{background:#ACA6B4!important}
  /* KPI 特色卡：浅粉渐变 + 细粉边（规范第11项保留） */

  .markdown code{background:#F0F1F4;padding:.1rem .3rem;border-radius:4px;font-size:.85em}

<script>
/* ================= 基础工具 ================= */
/* API 层
 * - 在线模式：直连后端 REST API
 * - 离线模式（localStorage wb_mock）：后端不可达时自动进入，页面保持可用 */
const MOCK_KEY = 'wb_mock';
const mockEnabled = () => localStorage.getItem(MOCK_KEY) === '1';
const realAPI = (path, opts = {}) => fetch('/api' + path, {
  headers: {'Content-Type': 'application/json'}, ...opts,
  body: opts.body ? JSON.stringify(opts.body) : undefined,
}).then(async r => {
  const data = r.status === 204 ? null : await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || r.statusText);
  return data;
});
async function API(path, opts = {}) {
  if (mockEnabled() && window.mockAPI) return window.mockAPI(path, opts);
  try {
    return await realAPI(path, opts);
  } catch (e) {
    if (e instanceof TypeError && window.mockAPI) {  // 网络不可达 → 离线模式
      localStorage.setItem(MOCK_KEY, '1');
      toast('后端连接失败，已进入离线模式', 'info');
      return window.mockAPI(path, opts);
    }
    throw e;
  }
}
function toggleMock(on) {
  localStorage.setItem(MOCK_KEY, on ? '1' : '0');
  toast(on ? '已进入离线模式' : '已恢复在线模式');
  render();
}

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate = s => s ? new Date(s).toLocaleString('zh-CN', {month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';

function toast(msg, type = 'ok') {
  const colors = {ok: 'bg-emerald-600', err: 'bg-rose-600', info: 'bg-slate-800'};
  const el = document.createElement('div');
  el.className = `${colors[type] || colors.info} text-white text-sm px-4 py-2.5 rounded-lg shadow-lg opacity-0 transition-opacity`;
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  requestAnimationFrame(() => el.classList.remove('opacity-0'));
  setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, 3200);
}

function openModal(html, width = 'max-w-2xl') {
  const root = document.getElementById('modal-root');
  root.innerHTML = `<div class="fixed inset-0 bg-slate-900/50 z-40 flex items-start justify-center overflow-y-auto py-10" onclick="if(event.target===this)closeModal()">
    <div class="bg-white rounded-2xl shadow-2xl ${width} w-full mx-4" onclick="event.stopPropagation()">${html}</div></div>`;
}
function closeModal() { document.getElementById('modal-root').innerHTML = ''; }

/* ================= 全局状态（单平台模式） ================= */
let platform = null;
let templates = ['对比选购', '案例实证', '风险避坑', 'FAQ问答', '场景方案'];
const selBrandVal = () => platform ? platform.id : 0;
async function refreshPlatform() { platform = await API('/platform'); }

const NAV = [
  ['monitor', '监测中心', 'M18 20V10M12 20V4M6 20v-6'],
  ['topics', '选题库', 'M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5'],
  ['answers', '大模型回答记录', 'M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.087.16 2.185.283 3.293.369V21l4.076-4.076a1.526 1.526 0 011.037-.443 48.282 48.282 0 005.68-.494c1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0012 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018z'],
  ['knowledge', '知识库', 'M4 19.5A2.5 2.5 0 016.5 17H20M4 19.5A2.5 2.5 0 016.5 22H20V2H6.5A2.5 2.5 0 004 4.5v15'],
  ['factory', '内容工厂', 'M13 10V3L4 14h7v7l9-11h-7'],
];

function renderNav() {
  const cur = location.hash.replace('#/', '') || 'monitor';
  document.getElementById('nav').innerHTML = NAV.map(([id, label, d]) => `
    <a href="#/${id}" class="nav-item flex items-center gap-4 mx-3 px-4 py-2.5 rounded-lg text-sm hover:bg-[#F2F2F5] hover:text-vip-500 ${cur === id ? 'bg-vip-50 text-vip-600 font-medium' : 'text-slate-600'}">
      <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="${d}"/></svg>${label}
    </a>`).join('');
  const on = mockEnabled();
  const badge = document.getElementById('mock-badge');
  if (badge) badge.classList.toggle('hidden', !on);
  const tb = document.getElementById('topbar-mock');
  if (tb) tb.classList.toggle('hidden', !on);
  const mt = document.getElementById('mock-toggle');
  if (mt) {
    mt.checked = on;
    document.getElementById('mock-track').className = `w-9 h-5 rounded-full relative transition ${on ? 'bg-vip-500' : 'bg-slate-200'}`;
    document.getElementById('mock-knob').className = `absolute top-0.5 left-0.5 w-4 h-4 bg-white rounded-full shadow transition-transform ${on ? 'translate-x-4' : ''}`;
  }
}

/* ================= 品牌选择器（已移除：单平台模式） ================= */


/* ================= 平台信息（内置配置，仅后端/设置页只读展示） ================= */
const v = id => document.getElementById(id).value.trim();

/* ================= 知识库（还原 GEO 知识治理中心的知识卡视图：浏览 + 审核 + 详情） ================= */
const KB_PAGE = 30;
const KB_QSTYLE = { '免审': 'bg-emerald-50 text-emerald-600', '抽检': 'bg-amber-50 text-amber-600', '必审': 'bg-rose-50 text-rose-600' };
const KB_TAG_LABEL = { passed: '已通过', rejected: '已拒绝', deleted: '已删除' };
let kbState = { q: '', quality: '', topic: '', src: '', tag: '', cautionOnly: false, page: KB_PAGE };
let kbCards = [];

async function viewKnowledge() {
  document.getElementById('view').innerHTML = '<div class="py-16 text-center text-slate-400 text-sm">加载中…</div>';
  kbCards = await API('/knowledge-cards').catch(() => []);
  kbState.page = KB_PAGE;
  renderKnowledge();
}
const kbUniq = (arrs) => [...new Set([].concat(...arrs))].filter(Boolean).sort();
function kbFiltered() {
  const q = kbState.q.trim().toLowerCase();
  return kbCards.filter(c => {
    if (kbState.quality && c.quality !== kbState.quality) return false;
    if (kbState.topic && !(c.topics || []).includes(kbState.topic)) return false;
    if (kbState.src && !(c.source_types || []).includes(kbState.src)) return false;
    if (kbState.cautionOnly && !c.cautions_count) return false;
    if (kbState.tag === 'untagged' && c.review) return false;
    if (['passed', 'rejected', 'deleted'].includes(kbState.tag) && (!c.review || c.review.tag !== kbState.tag)) return false;
    if (q && !(c.search_text || '').toLowerCase().includes(q)) return false;
    return true;
  });
}
function kbChip(c) {
  const rv = c.review;
  return [
    `<span class="px-1.5 py-0.5 rounded ${KB_QSTYLE[c.quality] || 'bg-slate-100 text-slate-500'}">${esc(c.quality || '未定级')}</span>`,
    rv ? `<span class="px-1.5 py-0.5 rounded ${rv.tag === 'passed' ? 'bg-emerald-600 text-white' : rv.tag === 'deleted' ? 'bg-slate-500 text-white' : 'bg-rose-500 text-white'}">${KB_TAG_LABEL[rv.tag]}</span>` : '',
    ...(c.topics || []).map(t => `<span class="px-1.5 py-0.5 rounded bg-vip-50 text-vip-600">${esc(t)}</span>`),
    ...(c.categories || []).map(t => `<span class="px-1.5 py-0.5 rounded bg-emerald-50 text-emerald-600">${esc(t)}</span>`),
    ...(c.pubs || []).map(p => `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500" title="来源主体">${esc(p)}</span>`),
    ...(c.source_types || []).map(t => `<span class="px-1.5 py-0.5 rounded ${t === '官方' ? 'bg-sky-50 text-sky-700' : t === '转载' ? 'bg-amber-50 text-amber-600' : 'bg-slate-100 text-slate-500'}">${esc(t)}</span>`),
    c.time ? `<span class="px-1.5 py-0.5 rounded bg-slate-100 text-slate-500">${esc(c.time)}</span>` : '<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-400">time 待补</span>',
    c.conflicts_count ? '<span class="px-1.5 py-0.5 rounded bg-rose-100 text-rose-600">说法不一致</span>' : '',
    c.merged_count ? `<span class="px-1.5 py-0.5 rounded bg-violet-50 text-violet-600">合并 ${c.merged_count} 张</span>` : '',
    c.status === '待人工审核' ? '<span class="px-1.5 py-0.5 rounded bg-rose-50 text-rose-600">待人工审核</span>' : '',
  ].filter(Boolean).join('');
}
function renderKnowledge() {
  const rows = kbFiltered();
  const shown = rows.slice(0, kbState.page);
  const topics = kbUniq(kbCards.map(c => c.topics || []));
  const srcs = kbUniq(kbCards.map(c => c.source_types || []));
  const kpi = (val, label, cls = 'text-slate-800') => `<div class="bg-white rounded-xl px-4 py-3 shadow-sm"><b class="text-lg ${cls}">${val}</b><span class="block text-[11px] text-slate-400 mt-0.5">${label}</span></div>`;
  const kpis = [
    kpi(`${rows.length} / ${kbCards.length}`, '卡片（当前/全部）'),
    kpi(kbCards.filter(c => c.quality === '免审').length, '免审（官方·无冲突）', 'text-emerald-600'),
    kpi(kbCards.filter(c => c.quality === '抽检').length, '抽检（含外部口径）', 'text-amber-600'),
    kpi(kbCards.filter(c => c.quality === '必审').length, '必审（有事实冲突）', 'text-rose-600'),
    kpi(kbCards.filter(c => c.status === '待人工审核').length, '待人工审核', 'text-rose-500'),
    kpi(kbCards.filter(c => c.cautions_count).length, '带使用提醒', 'text-amber-500'),
    kpi(kbCards.filter(c => c.conflicts_count).length, '含非官方口径冲突'),
    kpi(kbCards.filter(c => c.review).length, '已审核', 'text-vip-600'),
  ].join('');
  const ksel = (id, cur, opts, allLabel) => `<select id="${id}" onchange="setKbFilter('${id}', this.value)" class="text-xs border border-slate-200 rounded-lg px-2 py-1.5 bg-white text-slate-600">
      <option value="">${allLabel}</option>${opts.map(o => `<option value="${esc(o)}" ${o === cur ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
  document.getElementById('view').innerHTML = `
    <div class="flex items-center justify-between mb-5">
      <div><h1 class="text-2xl font-bold">知识库</h1>
      <p class="text-slate-500 text-sm mt-1">知识卡治理与文章沉淀，内容将作为生成时的证据注入</p></div>
      <div class="flex gap-2 items-center">
        <button onclick="kbAddDocModal()" class="bg-vip-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-vip-700">+ 添加文章</button>
      </div>
    </div>
    <div class="grid grid-cols-4 xl:grid-cols-8 gap-2 mb-4">${kpis}</div>

async function viewTopics() {
  const bid = platform ? platform.id : 0;
  if (!bid) return emptyView('平台信息未加载，请刷新页面重试');
  document.getElementById('view').innerHTML = '<div class="py-16 text-center text-slate-400 text-sm">加载中…</div>';
  const [mqueries, topics] = await Promise.all([
    API(`/monitor/queries?brand_id=${bid}`).catch(() => []),
    API(`/topics?brand_id=${bid}`).catch(() => []),
  ]);
  /* 近两期监测表现 */
  let latest = null, prev = null, latestRows = [], prevRows = [], latestRunId = null, prevRunId = null;
  try {
    const runs = await API(`/monitor/runs?brand_id=${bid}`);
    const done = runs.filter(r => r.status === 'completed')
      .sort((a, b) => ((a.started_at || '') > (b.started_at || '') ? 1 : -1)).slice(-2);
    prev = done.length > 1 ? done[0] : null;
    latest = done[done.length - 1] || null;
    if (latest) {
      latestRunId = latest.id;
      const da = await API(`/monitor/analysis?brand_id=${bid}&run_id=${latest.id}`);
      latestRows = da.queries || [];
      window._monRows = latestRows;
      if (prev) {
        const dp = await API(`/monitor/analysis?brand_id=${bid}&run_id=${prev.id}`);
        prevRows = dp.queries || [];
        prevRunId = prev.id;
      }
    }
  } catch (e) {}
  const top3Cache = {};
  const fetchTop3 = async (runId, qid) => {
    const key = runId + ':' + qid;
    if (key in top3Cache) return top3Cache[key];
    const ss = await API(`/monitor/samples?run_id=${runId}&query_id=${qid}`).catch(() => []);
    const val = ss.filter(s => !s.error);
    const t3 = val.length ? Math.round(1000 * val.filter(s => s.brand_rank >= 1 && s.brand_rank <= 3).length / val.length) / 10 : null;
    top3Cache[key] = {t3, samples: val};
    return top3Cache[key];
  };
  const rows = [];
  for (const q of mqueries) {
    const cur = latestRows.find(r => r.question === q.question);
    let mon = null;
    if (cur) {
      const prv = prevRows.find(r => r.question === q.question);
      const curData = await fetchTop3(latestRunId, cur.id);
      const prvData = prv ? await fetchTop3(prevRunId, prv.id) : null;
      mon = {
        qid: cur.id, latestRunId, active: q.active,
        dates: [prev, latest].filter(Boolean).map(r => (r.started_at || '').slice(5, 10).replace('-', '/')),
        cur: {row: cur, t3: curData.t3, samples: curData.samples},
        prev: prv ? {row: prv, t3: prvData.t3} : null,
      };
    }
    rows.push({q, mon, topic: topics.find(t => t.keyword.trim() === q.question.trim()) || null});
  }
  window._topicRows = rows;
  window._intentLabel = {buyer_intent: '买家意图', education: '需求教育', probe: '探测'};
  const dim = window._topicDim || '全部';
  const kw = (window._topicSearch || '').trim().toLowerCase();
  window._topicRowsView = rows.filter(r =>
    (dim === '全部' || hasTagDim(r.q.tags, dim)) &&
    (!kw || r.q.question.toLowerCase().includes(kw)));
  document.getElementById('view').innerHTML = `
    <div class="flex items-center justify-between mb-6">
      <div><h1 class="text-2xl font-bold">选题库</h1>
      <p class="text-slate-500 text-sm mt-1">用户会问 AI 的问题统一在这里管理：打标签、启停监测、看 AI 提及表现，并可直接生成文章</p></div>
      <div class="flex gap-2 items-center">
        <button onclick="mqModal()" class="bg-vip-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-vip-700">+ 添加问题</button>
      </div>
    </div>
    <div class="flex flex-wrap items-center gap-2 mb-4">
      ${['全部', ...MQ_TAGS].map(t => `<button onclick="setTopicDim('${t}')" class="text-xs px-3 py-1.5 rounded-full ${dim === t ? 'bg-vip-600 text-white' : 'bg-white border border-slate-200 text-slate-500 hover:text-vip-600 hover:border-vip-300'}">${t}</button>`).join('')}
      <input id="topic-search" value="${esc(window._topicSearch || '')}" oninput="topicSearch(this.value)" placeholder="搜索问题" class="flex-1 min-w-[200px] max-w-xs text-sm border border-slate-200 rounded-lg px-3 py-1.5 outline-none focus:ring-2 focus:ring-vip-200">
      <span class="text-xs text-slate-400"><b id="topic-count">${window._topicRowsView.length}</b> / ${rows.length} 个问题</span>
    </div>
    <div id="topic-batchbar"></div>
    <div id="topic-list" class="bg-white rounded-2xl shadow-sm divide-y divide-slate-100"></div>`;
  renderTopicRows();
}

async function factoryWizard(presetQid, presetTopic) {
  const bid = selBrandVal();
  const rateMap = {};
  const ana = await API(`/monitor/analysis?brand_id=${bid}`).catch(() => ({has_data: false}));
  if (ana.has_data) (ana.queries || []).concat(ana.brand_awareness || [])
    .forEach(r => { rateMap[r.id] = r.mention_rate; });
  let qs = [];
  try {
    const raw = await API(`/monitor/queries?brand_id=${bid}`);
    qs = raw.filter(q => q.active).map(q => ({qid: q.id, text: q.question, group: q.qgroup, rate: rateMap[q.id]}));
  } catch (e) {}
  let docs = [];
  try { docs = await API(`/documents?brand_id=${bid}`); } catch (e) {}
  window._fw = { step: 1, models: new Set(), qids: new Set(), qsearch: '', template: '对比选购',
    qs, presetTopic: presetTopic || null, jobs: [], done: 0, ok: 0, fail: 0,
    mode: 'template', docs, docsOpen: false, ref: null, refTab: 'link',
    refUrl: '', refParsed: null, refTitle: '', refContent: '', refParsing: false };
  if (presetQid) window._fw.qids.add(presetQid);
  fwStep1();
}

async function fwParseRefUrl() {

function fwUseParsedRef() {

function fwUsePastedRef() {

async function fwStart() {
  const w = window._fw;
  const items = w.qs.filter(q => w.qids.has(q.qid)).map(q => ({text: q.text, topicId: null, state: 'wait'}));
  if (w.presetTopic) items.unshift({text: w.presetTopic.keyword, topicId: w.presetTopic.id, state: 'wait'});
  w.jobs = items; w.done = 0; w.ok = 0; w.fail = 0; w.step = 3;
  fwRenderProgress();
  for (const job of items) {
    job.state = 'run'; fwRenderProgress();
    try {
      let topicId = job.topicId;
      if (!topicId) {
        const list = await API(`/topics?brand_id=${selBrandVal()}`).catch(() => []);
        let t = list.find(x => x.keyword.trim() === job.text.trim());
        if (!t) t = await API('/topics', {method: 'POST', body: {brand_id: selBrandVal(), keyword: job.text,
          intent: 'buyer_intent', dimension: '问答长尾', market: 'cn'}});
        topicId = t.id;
      }
      const payload = {brand_id: selBrandVal(), topic_id: topicId, template: w.template, models: [...w.models]};
      if (w.mode === 'imitate' && w.ref) {
        if (w.ref.docId) payload.ref_doc_id = w.ref.docId;
        else { payload.ref_title = w.ref.title || ''; payload.ref_body = w.ref.body || ''; }
      }
      await API('/articles/generate', {method: 'POST', body: payload});
      job.state = 'ok'; w.ok++;
    } catch (e) { job.state = 'err'; job.error = e.message; w.fail++; }
    w.done++;
    fwRenderProgress();
  }
  fwRenderProgress();
  facReload();
}

function fwRenderProgress() {
  const w = window._fw; if (!w || !w.jobs.length) return;
  const total = w.jobs.length, done = w.done;
  const running = done < total;
  openModal(`
    <div class="p-6">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-vip-50 text-vip-600 flex items-center justify-center text-lg shrink-0">✦</div>
        <div><div class="font-bold">${running ? '正在生成内容…' : '生成完成'}</div>
        <div class="text-xs text-slate-400 mt-0.5">${esc(w.mode === 'imitate' && w.ref ? '范文仿写 · ' + w.ref.title : w.template)} · ${w.models.size} 个目标模型 · 已完成 ${done}/${total}</div></div>
      </div>
      <div class="mt-4 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full bg-vip-500 rounded-full transition-all" style="width:${Math.round(100 * done / total)}%"></div></div>
      <div class="mt-4 border border-slate-200 rounded-xl max-h-60 overflow-y-auto divide-y divide-slate-100">
        ${w.jobs.map(j => `
          <div class="flex items-center gap-3 px-4 py-2.5">
            ${j.state === 'run' ? '<span class="w-4 h-4 border-2 border-vip-200 border-t-vip-600 rounded-full animate-spin shrink-0"></span>'
              : j.state === 'ok' ? '<span class="text-emerald-500 shrink-0">✓</span>'
              : j.state === 'err' ? '<span class="text-rose-500 shrink-0">✕</span>'
              : '<span class="w-4 h-4 rounded-full border-2 border-slate-200 shrink-0"></span>'}
            <span class="text-sm text-slate-600 truncate flex-1">${esc(j.text)}</span>
            ${j.state === 'ok' ? '<span class="text-xs text-emerald-600 shrink-0">已生成</span>'
              : j.state === 'err' ? '<span class="text-xs text-rose-400 shrink-0" title="' + esc(j.error || '') + '">失败</span>'
              : j.state === 'run' ? '<span class="text-xs text-vip-500 shrink-0">生成中…</span>'
              : '<span class="text-xs text-slate-300 shrink-0">等待中</span>'}
          </div>`).join('')}
      </div>
      ${running ? '' : `
      <div class="flex items-center justify-between mt-5">
        <div class="text-xs ${w.fail ? 'text-rose-500' : 'text-slate-400'}">${w.fail ? `${w.fail} 篇生成失败，可重新发起生成` : '全部生成成功，已进入待审核'}</div>
        <button onclick="closeModal()" class="bg-vip-600 hover:bg-vip-700 text-white text-sm font-medium px-6 py-2 rounded-lg">完成</button>
      </div>`}
    </div>`, 'max-w-xl');
}

function ansInTime(dateStr) {
  const t = _ansState.time;
  if (t === 'all') return true;
  const today = new Date().toISOString().slice(0, 10);
  const y = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  if (t === 'today') return dateStr === today;
  if (t === 'yesterday') return dateStr === y;
  if (t === 'custom') {
    if (_ansState.from && dateStr < _ansState.from) return false;
    if (_ansState.to && dateStr > _ansState.to) return false;
    return true;
  }
  const n = +t, from = new Date(Date.now() - (n - 1) * 86400000).toISOString().slice(0, 10);
  return dateStr >= from && dateStr <= today;
}

  openModal(`

      ${ss.map(s => sampleCard(s, aliases)).join('')}

function sampleCard(s, aliases) {
  const verdict = s.error ? ['采样失败', 'bg-rose-50 text-rose-600']
    : s.brand_mentioned ? ['已提及', 'bg-emerald-50 text-emerald-700']
    : ['未提及', 'bg-slate-100 text-slate-500'];
  let html = esc(s.answer || s.error || '（空）');
  for (const a of aliases) {
    if (a) html = html.replace(new RegExp(a.replace(/[.*+?^${}()|[\]\\\\]/g, '\\$&'), 'g'),
      m => `<mark class="bg-amber-200 rounded px-0.5">${m}</mark>`);
  }
  return `<div class="border border-slate-200 rounded-2xl p-4">
    <div class="flex items-center gap-2 mb-2 text-sm">
      <b>${esc(s.engine)}</b>
      ${s.brand_rank ? `<span class="text-xs px-2 py-0.5 rounded-full bg-vip-50 text-vip-600">位次 #${s.brand_rank}</span>` : ''}
      <span class="text-xs px-2 py-0.5 rounded-full ${verdict[1]}">${verdict[0]}</span>
      ${s.needs_review ? '<span class="text-xs px-2 py-0.5 rounded-full bg-amber-50 text-amber-600">待复核</span>' : ''}
      ${s.negative_cues.length ? `<span class="text-xs px-2 py-0.5 rounded-full bg-rose-50 text-rose-600">疑似负面：${s.negative_cues.join('、')}</span>` : ''}

    <div class="text-sm text-slate-600 whitespace-pre-wrap leading-relaxed">${html}</div>
    ${s.cited_domains.length ? `<div class="mt-2 pt-2 border-t border-slate-100 flex flex-wrap gap-1.5">
      ${s.cited_domains.map(d => `<span class="text-xs px-2 py-0.5 rounded ${d === platform?.domain ? 'bg-vip-50 text-vip-600 font-medium' : 'bg-slate-100 text-slate-500'}">${esc(d)}</span>`).join('')}
    </div>` : ''}
    ${s.competitors_mentioned.length ? `<div class="mt-1.5 text-xs text-slate-400">提及竞品：${s.competitors_mentioned.map(esc).join('、')}</div>` : ''}
  </div>`;
}

async function topicFromQuery(rowId) {
  const row = (window._monRows || []).find(r => r.id === rowId);
  if (!row) return;
  const intent = ['推荐', '比较', '替代', '价格'].includes(row.qgroup) ? 'buyer_intent' : 'education';
  await API('/topics', {method: 'POST', body: {brand_id: selBrandVal(), keyword: row.question, intent, dimension: '问答长尾', market: 'cn'}});
  toast('已加入选题库 → 可去内容工厂生产内容');
}

          <button onclick="topicsStartRun()" class="px-5 py-2 text-sm rounded-lg bg-vip-600 text-white hover:bg-vip-700">开始采样</button>
        </div>
      </div>
    </div>`, 'max-w-lg');
}
function runEngSync(cb) { cb.checked ? window._runEngines.add(cb.value) : window._runEngines.delete(cb.value); runTaskCount(); }
function setRunTimes(n) {
  window._runTimes = n;
  document.querySelectorAll('.run-times').forEach(b => {
    const on = b.textContent.trim().startsWith(String(n));
    b.className = `run-times text-xs px-3.5 py-1.5 rounded-full border ${on ? 'bg-vip-600 border-vip-600 text-white' : 'bg-white border-slate-200 text-slate-500 hover:border-vip-300'}`;
  });
  runTaskCount();
}
function runTaskCount() {
  const el = document.getElementById('run-task-count');
  if (el) el.textContent = (window._runScope || []).length * window._runEngines.size * window._runTimes;
}
async function topicsStartRun() {
  const engines = [...window._runEngines];
  if (!engines.length) return toast('请至少选择一个模型', 'err');
  try {
    const r = await API('/monitor/runs', {method: 'POST', body: {
      brand_id: selBrandVal(), engine_names: engines,
      query_ids: (window._runScope || []).map(q => q.id), times: window._runTimes || 1,
    }});
    closeModal();
    toast(`采样已启动：${r.queries || (window._runScope || []).length} 个问题 × ${engines.length} 模型 × ${window._runTimes || 1} 次 = ${r.total} 个任务`);
    setTimeout(() => pollRun(r.id), 800);
  } catch (e) { toast(e.message, 'err'); }
}
async function pollRun(runId) {
  clearTimeout(pollTimer);
  try {
    const r = await API(`/monitor/runs/${runId}`);
    const el = document.getElementById(`run-prog-${runId}`);
    if (el && r.status === 'running') {
      el.innerHTML = `<div class="w-48 bg-slate-100 rounded-full h-1.5"><div class="bg-vip-500 h-1.5 rounded-full transition-all" style="width:${r.total ? Math.round(100 * r.done / r.total) : 0}%"></div></div><span class="text-xs text-slate-400">${r.done}/${r.total}</span>`;
    } else if (el) {
      el.innerHTML = `<span class="text-xs text-emerald-600">已完成 ${r.done}/${r.total}</span>`;
    }
    if (r.status === 'running') pollTimer = setTimeout(() => pollRun(runId), 4000);
    else {
      toast(`采样完成：${r.done}/${r.total} 个任务`);
      if (location.hash.includes('monitor')) monRefresh();
    }
  } catch (e) { console.error(e); }
}

/* ================= 腾讯GEO平台（Answerbit 真实数据预览） ================= */
async function abFetch(path, params) {
  const qs = params ? '?' + new URLSearchParams(params).toString() : '';
  const r = await fetch('/api/answerbit' + path + qs);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  return j;
}
async function abCall(path, payload) {
  const r = await fetch('/api/answerbit/call', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ path, payload: payload || {} }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || ('HTTP ' + r.status));
  return j.data;
}
const abRetry = (fn, tries = 2) => fn().catch(e => tries > 1
  ? new Promise(r => setTimeout(r, 900)).then(() => abRetry(fn, tries - 1))
  : Promise.reject(e));
/* 限并发请求池：平台对同 Key 高并发会限流（400），3 路以内稳定 */
async function abPool(tasks, limit = 3) {
  const out = new Array(tasks.length); let i = 0;
  const worker = async () => { while (i < tasks.length) { const k = i++; out[k] = await tasks[k](); } };
  await Promise.all(Array.from({ length: Math.min(limit, tasks.length) }, worker));
  return out;
}
/* ================= 腾讯 Answerbit 真实数据视图（已配置 API Key 时主页面自动切换，无 Key 回退本地演示） ================= */
let AB_MODE = null;
const abMode = async () => {
  if (AB_MODE === null) {
    try { AB_MODE = !!(await abFetch('/status')).configured; }
    catch (e) { AB_MODE = false; }
  }
  return AB_MODE;
};

/* ================= 路由与辅助 ================= */
function emptyView(msg) {
  document.getElementById('view').innerHTML = `<div class="text-slate-400 py-20 text-center">${msg}</div>`;
}

async function render() {
  renderNav();
  const view = location.hash.replace('#/', '') || 'monitor';
  try {
    const fn = ({dashboard: viewMonitor, monitor: viewMonitor, knowledge: viewKnowledge, topics: viewTopics, answers: viewAnswers,
      monitor: viewMonitor, factory: viewFactory, articles: viewFactory}[view] || viewMonitor);
    await fn();  // await：async 视图函数的运行时错误也能被下方 catch 接住
  } catch (e) {
    console.error(e);
    emptyView('页面加载出错：' + e.message + '（多为浏览器缓存旧版页面，请 Cmd+Shift+R 强制刷新）');
    toast(e.message, 'err');
  }
}

window.addEventListener('hashchange', render);
refreshPlatform().then(render);
</script>
